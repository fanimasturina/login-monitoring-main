# ---- Build settings (Ant). Change the first two lines for your machine. ----

# Where Tomcat 11 is installed. Needed to compile (servlet-api.jar) and for "ant deploy".
catalina.home=/opt/tomcat

# Maven repository to download the libraries from. Inside the bank network, point this to
# your internal Nexus/Artifactory mirror, for example https://nexus.company.local/repository/maven-public
maven.repo=https://repo1.maven.org/maven2

# ---- Library versions (checked 16 Nov 2026). Before go-live, raise each one to the newest patch release. ----
# Spring Security 7.0.x gets free security fixes only until 31 Dec 2026. After the first successful build,
# plan the move to the 7.1.x line (change spring.security.version, run 'ant clean resolve war', test sign-in).
# If "ant resolve" stops with "Not Found", that version does not exist in the repository: look up the right one.
spring.version=7.0.10
spring.security.version=7.0.8
micrometer.version=1.16.0
commons.logging.version=1.3.5
jspecify.version=1.0.0
jstl.api.version=3.0.2
jstl.impl.version=3.0.1
mail.api.version=2.1.3
angus.mail.version=2.0.3
activation.api.version=2.1.3
angus.activation.version=2.0.2
postgresql.version=42.7.14
bootstrap.version=5.3.3
