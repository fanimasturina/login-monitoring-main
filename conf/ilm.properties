# Intelligent Login Monitoring - deployment configuration
#
# This file is packaged in the WAR as the default. For a real server, copy it to
#   $CATALINA_BASE/conf/ilm.properties        (or start Tomcat with -Dilm.config=/path/ilm.properties)
# and edit the copy. Values in that external file win. Keep it readable only by the Tomcat user (chmod 600).

# ---------------------------------------------------------------- Database
# JNDI name of the PostgreSQL connection pool defined in Tomcat (see conf/tomcat-context-example.xml).
db.jndi=jdbc/ilm

# ---------------------------------------------------------------- Sign-in (Microsoft Active Directory)
# One or more domain controllers, separated by a space. Use ldaps:// (port 636).
# The AD certificate authority must be trusted by the JVM that runs Tomcat (see README, "Active Directory").
#auth.ad.url=ldaps://dc01.corp.local:636 ldaps://dc02.corp.local:636
#auth.ad.domain=corp.local
# Optional. Default is derived from the domain: DC=corp,DC=local
#auth.ad.search.base=DC=corp,DC=local
# Only for a test AD without TLS. Never true in production: passwords would cross the network unencrypted.
auth.ad.allow.insecure=false
auth.ad.connect.timeout.ms=5000
auth.ad.read.timeout.ms=8000

# AD user IDs that become Administrator at their first sign-in (comma separated). Other users are added
# by an administrator on the Users page. Remove the names here once the first administrators exist.
auth.bootstrap.admins=

# Local accounts (password checked by this application, not AD). For development without AD, or for
# emergency access. Keep false in production unless there is an approved reason.
auth.local.enabled=false
auth.local.admin.user=localadmin
# Create the hash with:  java -cp build/core com.ilm.core.auth.PasswordHasher
auth.local.admin.hash=

# ---------------------------------------------------------------- How data arrives
# upload   = files are uploaded on the Upload page (default)
# realtime = this application also collects new events by itself every realtime.poll.seconds
ingest.mode=upload
realtime.poll.seconds=30

# Real-time source 1: Audit Trail Integrator database (fill in when ATI gives database access).
# Define a second, READ-ONLY connection pool in Tomcat and put its JNDI name here.
#realtime.ati.jndi=jdbc/ati
# The query must have exactly one "?" (the last Aua Id already collected) and return at least the columns
# aua_id, app_code, user_id, action_code, description, date_activity, endpoint. Adjust table and column
# names to the real ATI schema, using "AS" to keep these names.
#realtime.ati.sql=SELECT aua_id, app_code, user_id, action_code, menu, description, date_activity, endpoint FROM app_user_activity WHERE aua_id > ? AND action_code IN ('login','logout') ORDER BY aua_id
realtime.ati.id.column=aua_id
realtime.ati.batch=5000

# Real-time source 2: application log files readable on this server. Comma separated; add |APP-CODE per file.
#realtime.log.files=/var/log/regis/web-user.log|APP-REGIS,/var/log/regis/web-security.log|APP-REGIS

# Application codes offered on the Upload page for .log files.
apps.known=APP-REGIS,APP-ASSETIFY

# ---------------------------------------------------------------- Email alerts
mail.enabled=false
mail.smtp.host=smtp.corp.local
mail.smtp.port=25
mail.smtp.starttls=true
#mail.smtp.user=
#mail.smtp.password=
mail.from=ilm-noreply@corp.local
# Recipients, comma separated. When empty, active Security Analysts with an email address in AD receive it.
mail.to=
# At most this many emails per analysis run (a large historical upload should not flood the inbox).
mail.max.per.run=10
# Used for the link inside the email.
app.base.url=https://ilm.corp.local/ilm
